name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare application and Tailwind
        run: make setup
      - name: Check formatting, run tests and require 80% coverage
        working-directory: app
        run: ./gradlew check jacocoTestReport shadowJar
      - name: Report coverage
        run: python3 scripts/coverage.py app/build/reports/jacoco/test/jacocoTestReport.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            app/build/reports/tests/test
            app/build/reports/jacoco/test
            app/build/test-results/test
