services:
  - type: web
    name: page-analyzer-java-72
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: JDBC_DATABASE_URL
        fromDatabase:
          name: page-analyzer-java-72-db
          property: connectionString

databases:
  - name: page-analyzer-java-72-db
    plan: free
    region: frankfurt
    databaseName: page_analyzer_java_72_db
    user: page_analyzer_java_72_db_user
